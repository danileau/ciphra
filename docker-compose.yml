version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ciphra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    ports:
      - "5433:5432"
    volumes:
      - ciphra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphra"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ciphra

  api:
    build:
      context: ./api
    container_name: ciphra-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY required (see .env.example)}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      CIPHRA_DEV_MOCKS: ${CIPHRA_DEV_MOCKS:-0}
      PYTHONUNBUFFERED: "1"
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    command: python server.py
    networks:
      - ciphra

  frontend:
    build:
      context: ./frontend
    container_name: ciphra-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api:5000
    networks:
      - ciphra

  nginx:
    image: nginx:alpine
    container_name: ciphra-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - ciphra

networks:
  ciphra:
    driver: bridge

volumes:
  ciphra_pgdata:
