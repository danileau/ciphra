# Dependabot config (2026-06-12) — replaces the unfilled template stub
# (package-ecosystem: "") whose invalid config made every updater run
# error since at least 2026-06-07.
#
# Discipline (feedback_dependabot_major_versions): NEVER blind-merge
# major bumps — a major rides its own PR, gets read release notes, and
# a local test pass. Minor/patch are grouped weekly to keep PR noise
# down; they still go through CI like everything else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 is a ground-up rewrite (PostCSS plugin moved to
      # @tailwindcss/postcss, CSS-first config, changed default behaviours).
      # It needs a deliberate migration + full visual-regression pass, not a
      # dependabot bump — hold the major until we do it on purpose. v3
      # minor/patch still flow through.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # jsdom major bumps break the test env (24->29 failed CI). Dev-only,
      # no urgency; hold the v24 line until a deliberate upgrade.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      # @types/node majors TRACK THE NODE RUNTIME MAJOR — 24.x describes
      # Node 24, 26.x describes Node 26. This app runs Node 24 (Dockerfile.prod
      # builder + runtime, CI node-version: 24), so the types must stay on 24.
      # They had drifted to 25 and dependabot was proposing 26: types two majors
      # ahead of the runtime describe APIs that do not exist here, which
      # typecheck clean and then throw in prod. Bump this only together with the
      # Node version in Dockerfile.prod and ci.yml.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Actions are low-risk infra — standard, well-maintained actions
      # whose major bumps (checkout v4→v6, etc.) rarely change behavior.
      # Unlike app deps (npm/pip), group ALL update-types into one weekly
      # PR instead of one-per-action. The majors-ride-their-own-PR rule
      # (feedback_dependabot_major_versions) is for runtime/app deps; CI
      # action versions don't warrant that ceremony.
      actions-all:
        patterns: ["*"]
