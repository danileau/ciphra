# Dependabot config (2026-06-12) — replaces the unfilled template stub
# (package-ecosystem: "") whose invalid config made every updater run
# error since at least 2026-06-07.
#
# Discipline (feedback_dependabot_major_versions): NEVER blind-merge
# major bumps — a major rides its own PR, gets read release notes, and
# a local test pass. Minor/patch are grouped weekly to keep PR noise
# down; they still go through CI like everything else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Actions are low-risk infra — standard, well-maintained actions
      # whose major bumps (checkout v4→v6, etc.) rarely change behavior.
      # Unlike app deps (npm/pip), group ALL update-types into one weekly
      # PR instead of one-per-action. The majors-ride-their-own-PR rule
      # (feedback_dependabot_major_versions) is for runtime/app deps; CI
      # action versions don't warrant that ceremony.
      actions-all:
        patterns: ["*"]
