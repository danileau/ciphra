# Dependabot config (2026-06-12) — replaces the unfilled template stub
# (package-ecosystem: "") whose invalid config made every updater run
# error since at least 2026-06-07.
#
# Discipline (feedback_dependabot_major_versions): NEVER blind-merge
# major bumps — a major rides its own PR, gets read release notes, and
# a local test pass. Minor/patch are grouped weekly to keep PR noise
# down; they still go through CI like everything else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 is a ground-up rewrite (PostCSS plugin moved to
      # @tailwindcss/postcss, CSS-first config, changed default behaviours).
      # It needs a deliberate migration + full visual-regression pass, not a
      # dependabot bump — hold the major until we do it on purpose. v3
      # minor/patch still flow through.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # jsdom major bumps break the test env (24->29 failed CI). Dev-only,
      # no urgency; hold the v24 line until a deliberate upgrade.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      # @types/node majors TRACK THE NODE RUNTIME MAJOR — 24.x describes
      # Node 24, 26.x describes Node 26. This app runs Node 24 (Dockerfile.prod
      # builder + runtime, CI node-version: 24), so the types must stay on 24.
      # They had drifted to 25 and dependabot was proposing 26: types two majors
      # ahead of the runtime describe APIs that do not exist here, which
      # typecheck clean and then throw in prod. Bump this only together with the
      # Node version in Dockerfile.prod and ci.yml.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native (Go) compiler rewrite, and the toolchain is
      # not ready: svelte-check 4.7.6 peers `typescript: ^5 || ^6`, so a bump to
      # 7 makes `npm ci` ERESOLVE and fails the frontend job (PR #150). Hold the
      # major until @sveltejs/kit + svelte-check declare TS 7 support; 6.x
      # minor/patch still flow through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # SvelteKit 3 (+ adapter-node 6, which peers it) is a framework
      # migration, not a bump — #231 failed the frontend job. Hold both majors
      # until it is done on purpose; 2.x minor/patch still flow through.
      - dependency-name: "@sveltejs/kit"
        update-types: [version-update:semver-major]
      - dependency-name: "@sveltejs/adapter-node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images are pinned to exact versions, so something has to move them:
  # a floating tag only refreshes when the image happens to be rebuilt.
  # Majors stay held — the Node major tracks @types/node (see above).
  - package-ecosystem: docker
    directories: [/frontend, /nginx, /api]
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      # nginx odd minors are mainline, even minors are stable, and Dependabot
      # can't tell them apart (it offered mainline 1.31 in #228). Stay on the
      # stable line: patches flow, the next stable minor is a manual bump.
      - dependency-name: nginx
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Python 3.11 → 3.12 is a runtime upgrade (C extensions, deprecations),
      # not a bump. Patches (3.11.x) flow; the minor moves on purpose.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Actions are low-risk infra — standard, well-maintained actions
      # whose major bumps (checkout v4→v6, etc.) rarely change behavior.
      # Unlike app deps (npm/pip), group ALL update-types into one weekly
      # PR instead of one-per-action. The majors-ride-their-own-PR rule
      # (feedback_dependabot_major_versions) is for runtime/app deps; CI
      # action versions don't warrant that ceremony.
      actions-all:
        patterns: ["*"]
