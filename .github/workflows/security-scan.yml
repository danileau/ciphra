# Scheduled vulnerability scan (2026-06-12) — closes the gap the
# PR-triggered gate cannot: a CVE published AFTER the last commit hits
# existing lockfiles and the base layers (alpine/debian) of images
# already running in prod. Runs daily against a fresh scanner + fresh
# DB (no cache here on purpose), scans the repo AND the published
# images, and fails loudly — GitHub emails the repo owner on a failed
# scheduled run. A red run means: assess, then either bump deps /
# rebuild+redeploy images, or document the acceptance.
#
# Trivy itself is pinned (`version:`) to the SAME release as ci.yml's PR gate:
# with `latest`, the daily scan and the gate could disagree only because they
# ran different scanners. Dependabot can't bump this input — move all four
# `version:` lines together, by hand, with the trivy-action bump. The vuln DB
# is not pinned and stays fresh; only the scanner binary is.
name: Security scan

on:
  schedule:
    - cron: '20 4 * * *'   # daily 04:20 UTC — before the operator's day
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy fs scan, fresh DB
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # SAST/DAST F7 — add misconfig + secret to the default vuln scan so
          # Dockerfile/IaC issues (e.g. images running as root, DS002) and any
          # committed secret gate CI, not just dependency CVEs.
          scanners: vuln,secret,misconfig
          # F2 — documented risk acceptances (e.g. nginx must bind :443 as
          # root) live in .trivyignore.yaml. NB: golive/ is gitignored and
          # untracked, so it isn't in the CI checkout and is never scanned
          # here — no skip needed. (A local `trivy fs .` WILL see it, which is
          # fine: it's the operator's deploy dir, not a CI-built image.)
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.1   # pinned — see the note at the top of this file

  # Which images is prod running? `:latest` is the newest BUILD, and a build
  # can sit undeployed for days (it did for 1.5.1) — scanning it reports the
  # next release, not the exposure. The VPS deploys the newest `deploy-<sha>`
  # tag by `--sort=-creatordate` (OPERATIONS.md); resolve it the same way.
  live:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="$(git for-each-ref --sort=-creatordate --count=1 --format='%(refname:strip=2)' 'refs/tags/deploy-*')"
          [ -n "$tag" ] || { echo "::error::no deploy-* tag found — cannot tell what prod runs"; exit 1; }
          echo "Live per deploy tags: $tag"
          echo "sha=${tag#deploy-}" >> "$GITHUB_OUTPUT"

  images:
    needs: live
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ciphra-frontend, ciphra-api, ciphra-nginx]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy image scan of the LIVE image (base layers + bundled deps), fresh DB
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.live.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.1   # pinned — see the note at the top of this file
