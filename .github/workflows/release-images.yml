# Release images — every merge to main publishes deployable images to
# ghcr.io (2026-06-12). This replaces the build-on-VPS ritual; the VPS
# becomes a consumer: docker pull + tag bump + restart, operator-run
# (deploys stay a human action by explicit decision — no SSH from CI).
#
# Tags per image: the 7-char commit SHA (what CIPHRA_TAG points at) and
# a moving `latest`. Rollback = previous SHA tag, exactly like before.
#
# Images are SIGNED (cosign keyless via GitHub OIDC, logged to Rekor):
# the signature pins the identity of THIS workflow on THIS repo. The
# deploy ritual verifies before restart — see OPERATIONS.md. Honest
# scope: protects the registry→VPS link (tampered/foreign images);
# does NOT protect against a compromised GitHub account (it signs
# "legitimately") and is unrelated to the THREAT_MODEL JS-swap item.
#
# The frontend image needs the repo docs staged into its build context
# (the ciphraDocs vite plugin resolves /docs-src inside the container —
# launch v0.1.0 missed this and shipped an empty /docs section).
#
# nginx joined the pipeline 2026-06-12 (context moved in-repo to
# nginx/): all three prod images are now CI-built and signed. TLS
# material stays bind-mounted on the VPS — never in any image.
#
# VPS one-time setup to consume these images (operator):
#   docker login ghcr.io -u danileau -p <PAT with read:packages>
#   .env: CIPHRA_REGISTRY=ghcr.io/danileau, CIPHRA_TAG=<sha>
name: Release images

on:
  push:
    branches: [main]
  # Base-layer CVEs land with no commit to trigger on. On 2026-08-21 the
  # published api image was 10 days old and carried 36 HIGHs from
  # util-linux 2.41-5, fixed upstream as 2.41.5-0+deb13u1 — the Dockerfile
  # already ran `apt-get upgrade`, there had simply been no build since.
  # Push-only meant the sole way to republish was a dummy commit. This is
  # a rebuild button: same main, fresh apt/apk upgrade. It publishes; it
  # does not deploy (the operator still pulls — see OPERATIONS.md).
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (GitHub OIDC)

jobs:
  # Standardize + FORCE the image version tag. Reads the VERSION file, runs the
  # same guard as CI (valid SemVer + package.json + CHANGELOG), and exports the
  # version for the image jobs. An invalid/missing VERSION fails here, so no
  # images are published without a standardized X.Y.Z tag. See docs/VERSIONING.md.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # version-guard's computed-bump check needs tags + history.
          fetch-depth: 0
      - name: Guard + resolve version
        id: v
        run: |
          scripts/version-guard.sh
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  frontend-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage docs for the ciphraDocs vite plugin
        run: |
          mkdir -p frontend/_docs-src
          cp -r docs README.md SECURITY.md CHANGELOG.md frontend/_docs-src/
      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ciphra-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          # Run-scoped cache-bust: forces the OS-upgrade / npm-strip layer to
          # re-run each build so :latest can't drift behind fixed-upstream CVEs
          # while the gha cache replays a stale layer (see the Dockerfiles).
          # NOT github.sha — a workflow_dispatch rebuild of an unchanged main
          # repeats the SHA and the stale layer comes straight back.
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, by digest)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/ciphra-frontend@${{ steps.build.outputs.digest }}

  api-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ciphra-api
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          # Run-scoped cache-bust — re-run apt upgrade each build. NOT github.sha:
          # a workflow_dispatch rebuild of an unchanged main repeats the SHA and
          # would replay the cached (stale) layer. See api/Dockerfile.
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, by digest)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/ciphra-api@${{ steps.build.outputs.digest }}

  nginx-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ciphra-nginx
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: nginx
          file: nginx/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          # Run-scoped cache-bust — re-run apk upgrade each build. NOT github.sha:
          # a workflow_dispatch rebuild of an unchanged main repeats the SHA and
          # would replay the cached (stale) layer. See nginx/Dockerfile.prod.
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, by digest)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/ciphra-nginx@${{ steps.build.outputs.digest }}
