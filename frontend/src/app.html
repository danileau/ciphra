<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
	<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-192.png" />
	<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#faf8f6" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="ciphra" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<!-- Perf review (PI v13): no Google Fonts. Every visit pinged
	     googleapis.com which contradicts the "encrypted by design" brand
	     and was a render-blocking request on landing. Inter is now
	     served from the system stack with woff2 fallbacks; the system
	     UI font is what most users render at native quality anyway. -->
	<meta name="description" content="ciphra — the encrypted diary for chronic conditions. Encrypted with your password, right in your browser." />
	<!-- CIPH-pi22-L-2 — canonical anchors search-engine ranking on the
	     production origin. Per-route canonicals override via <svelte:head>
	     where useful (/conditions/[id] etc); this is the site-wide default. -->
	<link rel="canonical" href="https://ciphra.ch/" />
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover" class="bg-surface text-surface-slate font-sans min-h-screen antialiased">
	<div style="display: contents">%sveltekit.body%</div>
	<script>
		// Perf review (PI v13): defer SW registration to after first
		// paint so SvelteKit hydration isn't held back by the SW
		// install handshake on slow connections.
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/sw.js').catch(() => {});
			});
		}
	</script>
</body>
</html>
