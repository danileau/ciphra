<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
	<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-192.png" />
	<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#faf8f6" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#181310" media="(prefers-color-scheme: dark)" />
	<!-- Dark mode (design review 2026-06-11) — apply the stored theme
	     before first paint so OS-dark users don't get a white flash.
	     Mirrors $lib/stores/theme.ts (keep in sync). CSP note: relies on
	     script-src 'unsafe-inline' (launch tactical); when the Track-3
	     CSP tightening lands, add this script's sha256 hash instead. -->
	<script>
		try {
			var c = localStorage.getItem('ciphra_theme');
			if (c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.dataset.theme = 'dark';
			}
		} catch (e) { /* storage blocked: stay light */ }
	</script>
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="ciphra" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<!-- Perf review (PI v13): no Google Fonts. Every visit pinged
	     googleapis.com which contradicts the "encrypted by design" brand
	     and was a render-blocking request on landing. Inter is now
	     served from the system stack with woff2 fallbacks; the system
	     UI font is what most users render at native quality anyway. -->
	<meta name="description" content="ciphra — the encrypted diary for chronic conditions. Encrypted with your password, right in your browser." />
	<!-- CIPH-pi22-L-2 — canonical anchors search-engine ranking on the
	     production origin. Per-route canonicals override via <svelte:head>
	     where useful (/conditions/[id] etc); this is the site-wide default. -->
	<link rel="canonical" href="https://ciphra.ch/" />
	<!-- CIPH-pi22-L-3 — JSON-LD: WebSite + Organization. Per Hans's L-1
	     persona-dry-run deduct, MedicalWebPage / MedicalApplication markers
	     are deferred until the MDR/MepV regulatory check (see
	     project_medical_device_assessment.md). Generic WebSite +
	     Organization markers describe the brand without inviting medical-
	     device classification scrutiny. -->
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "WebSite",
					"@id": "https://ciphra.ch/#website",
					"url": "https://ciphra.ch/",
					"name": "ciphra",
					"description": "The encrypted diary for chronic conditions. Encrypted with your password, right in your browser.",
					"inLanguage": ["de", "en", "fr", "it"],
					"publisher": { "@id": "https://ciphra.ch/#organization" }
				},
				{
					"@type": "Organization",
					"@id": "https://ciphra.ch/#organization",
					"name": "ciphra",
					"url": "https://ciphra.ch/",
					"logo": "https://ciphra.ch/icon-512.png"
				}
			]
		}
	</script>
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover" class="bg-surface text-surface-slate font-sans min-h-screen antialiased">
	<noscript>
		<!-- CIPH-pi22-L-4 — JS-disabled fallback. Ciphra runs the entire
		     encryption stack in the browser, so JS is genuinely required.
		     For privacy-conscious users who reach for noscript first, give
		     them an honest answer + a path to /privacy explaining why. -->
		<div style="max-width: 36rem; margin: 4rem auto; padding: 1.5rem; font-family: system-ui, sans-serif; color: #2d2a26; background: #fefcf9; border: 1px solid #d8cdba; border-radius: 0.75rem;">
			<h1 style="font-size: 1.5rem; margin: 0 0 0.75rem; font-weight: 600;">ciphra needs JavaScript</h1>
			<p style="margin: 0 0 0.75rem; line-height: 1.55;">
				Your password derives the encryption key in this browser tab — the
				server never sees it. Without JavaScript that derivation can't run,
				so ciphra refuses to load rather than silently weaken its promise.
			</p>
			<p style="margin: 0; line-height: 1.55;">
				The full architecture is documented at
				<a href="/privacy" style="color: #b23c2c; text-decoration: underline;">/privacy</a>.
			</p>
		</div>
	</noscript>
	<div style="display: contents">%sveltekit.body%</div>
	<script>
		// Perf review (PI v13): defer SW registration to after first
		// paint so SvelteKit hydration isn't held back by the SW
		// install handshake on slow connections.
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/sw.js').catch(() => {});
			});
		}
	</script>
</body>
</html>
