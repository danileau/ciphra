# Dev nginx (HTTP-only on port 80, hot-reload SvelteKit at :5173).
#
# Prod-deploy reviewer checklist (security review PI v13):
#   1. Listen on 443 with TLS (Cloudflare or letsencrypt origin cert).
#   2. Add `add_header Strict-Transport-Security ...` here OR rely on
#      the API-side HSTS — which fires correctly because we forward
#      X-Forwarded-Proto below + the API uses ProxyFix(x_proto=1).
#   3. Tighten the rate-limit at this layer too (`limit_req_zone`)
#      since the API limiter is in-memory across gunicorn workers.
#   4. Don't strip X-Forwarded-For — the API rate-limit + HSTS gating
#      depend on it.

server {
    listen 80;
    server_name localhost;

    # Frontend (SvelteKit dev server)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:5000;
    }
}
