# Shared proxy headers for all backend locations.
# The API's ProxyFix + rate-limiter both read X-Forwarded-For, so do NOT
# drop it. X-Forwarded-Proto must stay "https" so the API's HSTS gating
# behaves correctly.
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto https;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        "upgrade";
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Response-header buffers. The DEFAULT proxy_buffer_size (4k/8k) is smaller
# than the response HEADER SvelteKit emits for a heavy route: /reports carries
# a `Link:` header preloading ~45 module chunks — several KB in one header —
# plus the full CSP. When that header exceeded the buffer, nginx answered the
# UPSTREAM's own 200 with a 502 and logged "upstream sent too big header"
# (prod incident 2026-08-22 07:13: /reports 502 while the frontend container
# returned 200 directly). Sized for headroom as the chunk graph grows; applies
# to every proxied location since each includes this file.
proxy_buffer_size       16k;
proxy_buffers           8 16k;
proxy_busy_buffers_size 32k;
