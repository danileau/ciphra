# ciphra production nginx.
#
# Cloudflare terminates user-facing TLS; this nginx serves the Cloudflare
# origin certificate (15-year, generated in CF dashboard).
#
# The host firewall (firewall/cloudflare-only.sh) already restricts inbound
# 443 to Cloudflare IP ranges, so this config trusts CF as the only client
# but still hardens defensively.

# Rate-limit zones. Real-IP is rewritten from CF-Connecting-IP before these
# fire (see real_ip_header below), so $binary_remote_addr is the end-user.
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
# Normal authenticated app traffic (load/save/update single docs). Reverted
# 2026-06-21 (Track-3 3.15) from the temporary 1200r/m migration bump: bulk
# import (3.4, POST /api/documents/batch) now collapses a migration to a
# handful of requests, so the general zone no longer has to carry it.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
# Bulk-import zone (migration only). Isolated from api_general so a migration
# burst can't exhaust the user's normal API budget and vice-versa. The app
# caps this route at 30/min; nginx is the coarse outer bound (each request is
# heavy — up to 100 inserts — so it stays bounded, not unlimited).
limit_req_zone $binary_remote_addr zone=api_batch:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=300r/m;

# Docker bridge gateway — traffic from the docker-proxy NAT arrives with
# the bridge gateway IP (172.18.0.1 for our `ciphra` network) as $remote_addr.
# Without trusting this, real_ip_header CF-Connecting-IP is ignored and the
# rate-limiter sees every external user as the same docker gateway IP.
# 172.16.0.0/12 covers all default docker bridge networks (172.17–172.31).
set_real_ip_from 172.16.0.0/12;

# Cloudflare IP ranges — trust their X-Forwarded-For and rewrite client IP.
# Update with firewall/cloudflare-only.sh (which generates a matching file).
# v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 443 ssl http2;
    server_name ciphra.ch;

    # SAST/DAST F3 — suppress version/banner disclosure. `server_tokens off`
    # drops the nginx version from the Server header + error pages;
    # `proxy_hide_header Server` strips the upstream gunicorn/SvelteKit Server
    # header so a probe learns neither the proxy nor the app-server version.
    server_tokens off;
    proxy_hide_header Server;

    ssl_certificate     /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The whole point of having CF in front is that they take the heat;
    # only respond when the request claims to come from a CF edge.
    if ($http_cf_connecting_ip = "") { return 444; }

    # Defence-in-depth headers. Cloudflare can also set most of these, but
    # owning them at origin means the contract isn't dependent on CF config.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy is now emitted by SvelteKit per-response
    # (frontend/svelte.config.js → kit.csp, mode 'hash'). Track 3 P0 (3.1):
    # script-src dropped 'unsafe-inline' — SvelteKit hashes its inline
    # hydration bootstrap, and the two app.html author scripts (dark-mode
    # pre-paint + SW registration) are pinned by sha256 hash (guarded by
    # src/app-html-csp.test.ts). style-src KEEPS 'unsafe-inline' (~970
    # dynamic inline style="" attributes can't be hashed). connect-src
    # whitelists the epilepc migration origins (apex/www/direct).
    # DO NOT re-add a CSP header here: a second CSP header would intersect
    # with SvelteKit's, and the per-build script hashes only live in the app.
    # (HSTS / X-Frame-Options / nosniff / Referrer-Policy / Permissions-Policy
    # stay at the edge above — they're static and response-wide.)

    client_max_body_size 2m;

    # ── Scanner-noise sink (2026-06-12) ──────────────────────────────
    # Internet background-radiation bots spray PHP/CMS/dotfile exploit
    # paths at every public IP. ciphra runs none of that stack, so these
    # always 404'd harmlessly — but the frontend SSR occasionally 500s on
    # the weirder probes, which then surfaced in the nightly error digest
    # as noise. 444 closes the connection with no response, so the probe
    # dies here before reaching the frontend proxy — denying the scanner
    # even a status code and keeping the digest signal clean. Origin-side
    # companion to the Cloudflare WAF rule (edge block).
    #
    # Conservative by design — ONLY paths that are never part of ciphra.
    # On a medical app a false 444 on a real route is worse than letting
    # a harmless probe through, so this list stays tight. `.well-known`
    # is deliberately NOT matched (security.txt / ACME live there).
    location ~* \.php$                       { return 444; }
    location ~  ^/\.(git|env|aws|ssh|svn|hg) { return 444; }
    location ~* ^/(wp-|xmlrpc|phpmyadmin|adminer) { return 444; }

    # ── Upstream resolution ────────────────────────────────────────────────
    # `proxy_pass http://frontend:3000` with a literal name and no resolver is
    # resolved ONCE, at config load, and the IP is cached for the worker's
    # lifetime. A deploy recreates the containers, compose can hand them a
    # different address, and nginx then proxies to an IP nobody is listening on
    # — a persistent 502 on every request until nginx itself is restarted. It
    # does not self-heal.
    #
    # Reproduced: recreate the api container so it comes back on a new address
    # (172.24.0.4 -> .6) without touching nginx. Three requests, three 502s.
    # `nginx -s reload` -> 200 immediately.
    #
    # 127.0.0.11 is Docker's embedded DNS. A VARIABLE in proxy_pass is what
    # forces re-resolution per request; a literal name would still be cached
    # even with a resolver present. `$request_uri` is required with the
    # variable form to keep passing the original path — the literal form did
    # that implicitly.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend frontend;
    set $upstream_api api;

    # Argon2 WASM must be served with correct MIME + immutable cache so the
    # SRI-pinned import succeeds.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://$upstream_frontend:3000$request_uri;
    }

    # The service worker is the update mechanism — it must NEVER be edge-cached,
    # or a deploy's new worker is shadowed (the frontend serves /sw.js with a 4h
    # max-age, Cloudflare honored it, and a stale v4 was served for hours until a
    # manual purge — 2026-06-13). `expires -1` → `Cache-Control: no-cache` so the
    # browser + CF revalidate every time and pick up a new worker immediately.
    # Deliberately NO `add_header` here: an add_header in a location drops ALL
    # inherited server-level headers (CSP/HSTS/...), and /sw.js should keep them.
    location = /sw.js {
        proxy_pass http://$upstream_frontend:3000$request_uri;
        include /etc/nginx/proxy_params.conf;
        expires -1;
    }

    # Auth endpoints — tight rate limit.
    location ~ ^/api/(login|register|recover|change-password) {
        limit_req zone=api_login burst=5 nodelay;
        proxy_pass http://$upstream_api:5000$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    # General API.
    # Bulk-import endpoint (Track-3 3.4). Dedicated zone + a larger body limit
    # (up to 100 encrypted docs per request can exceed the global 2m). Exact
    # match takes priority over the /api/ prefix below.
    location = /api/documents/batch {
        limit_req zone=api_batch burst=20 nodelay;
        client_max_body_size 10m;
        proxy_pass http://$upstream_api:5000$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://$upstream_api:5000$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location = /health {
        access_log off;
        proxy_pass http://$upstream_api:5000$request_uri;
    }

    # Frontend (adapter-node SSR on :3000). Public pages get a higher rate
    # limit than the API.
    location / {
        limit_req zone=public burst=50 nodelay;
        proxy_pass http://$upstream_frontend:3000$request_uri;
        include /etc/nginx/proxy_params.conf;
    }
}

# Port 80 isn't exposed to the internet (firewall blocks it), but if anyone
# inside the docker network hits it accidentally, send them to https.
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}
